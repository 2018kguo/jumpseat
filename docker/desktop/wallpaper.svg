<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1600" viewBox="0 0 2560 1600">
  <!-- Smooth gradients only, no noise or texture: a flat wallpaper costs the
       encoder next to nothing when it is uncovered. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111c33"/>
      <stop offset="1" stop-color="#1a1f3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#3b5bdb" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3b5bdb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="2560" height="1600" fill="url(#sky)"/>
  <rect width="2560" height="1600" fill="url(#glow)"/>
  <g transform="translate(2368 1512)" fill="#e2e8f0" fill-opacity="0.55">
    <!-- A seat, seen from the side: the mark next to the wordmark. -->
    <path d="M-276 -34h14a6 6 0 0 1 6 6v20h22a6 6 0 0 1 6 6v8h-48a6 6 0 0 1-6-6v-28a6 6 0 0 1 6-6z"/>
    <text x="0" y="0" text-anchor="end" font-family="DejaVu Sans" font-weight="bold" font-size="40" letter-spacing="-0.5">jumpseat</text>
  </g>
</svg>
